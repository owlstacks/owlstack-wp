name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Triggers on tags like v1.0.0, v1.2.3

permissions:
  contents: write      # Required to create GitHub Releases

env:
  PLUGIN_SLUG: owlstack

jobs:
  build:
    name: Build Plugin Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: make build VERSION=${{ steps.version.outputs.VERSION }}

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}-${{ steps.version.outputs.VERSION }}
          path: dist/${{ env.PLUGIN_SLUG }}-${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.PLUGIN_SLUG }}-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true

